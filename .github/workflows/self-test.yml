name: Maulome PR Review & Fix Self-Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event_name == 'pull_request'
    uses: skyspec28/Maulome-Review-bot-/.github/workflows/reusable-review.yml@feat/maulome-fix
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  fix:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@maulome fix')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@maulome fix'))
    uses: skyspec28/Maulome-Review-bot-/.github/workflows/reusable-fix.yml@feat/maulome-fix
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
